<app-ncs-card class="fixed bottom-4 left-4 top-4 z-30 w-[264px] overflow-y-scroll">
  <div class="flex gap-4 flex-col">
    <a routerLink="/" class="flex items-center gap-3 rounded-2xl text-slate-950 no-underline" aria-label="Go to home">
      <div class="grid h-12 w-12 shrink-0 place-items-center">
        <img src="/assets/ng-craft-logo.png" alt="NgCraft Studio logo" class="h-10 w-10" />
      </div>

      <div class="min-w-0">
        <div class="text-[21px] font-semibold leading-6 tracking-[-0.04em]">
          NgCraft <span class="text-[#165144]">Studio</span>
        </div>
      </div>
    </a>

    <app-ncs-card class="flex min-h-0 flex-1 flex-col gap-6 overflow-y-auto" aria-label="Sidebar navigation">
      <section class="grid gap-2">
        <p class="text-xs p-1.5 font-semibold uppercase tracking-wide text-slate-500">
          Components
        </p>

        @for (item of componentItems; track item.route) {
        <a ncsButton variant="choice" size="md" align="start" [block]="true" [routerLink]="item.route"
          routerLinkActive="is-active" #componentLink="routerLinkActive">
          <svg [lucideIcon]="item.icon" class="h-5 w-5 shrink-0"></svg>

          <span class="truncate">{{ item.label }}</span>

          @if (componentLink.isActive) {
          <span class="ml-auto h-2 w-2 rounded-full bg-blue-600"></span>
          }
        </a>
        }
      </section>

      <section class="grid gap-2 border-t border-slate-200 pt-5">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
          Resources
        </p>

        @for (item of resourceItems; track item.route) {
        <a ncsButton variant="choice" size="md" align="start" [block]="true" routerLinkActive="is-active"
          #resourceLink="routerLinkActive" [routerLink]="item.route">
          <svg [lucideIcon]="item.icon" class="h-5 w-5 shrink-0 text-current"></svg>

          <span class="truncate">{{ item.label }}</span>

          @if (resourceLink.isActive) {
          <span class="ml-auto h-2 w-2 rounded-full bg-blue-600"></span>
          }
        </a>
        }
      </section>
    </app-ncs-card>
  </div>
</app-ncs-card>
