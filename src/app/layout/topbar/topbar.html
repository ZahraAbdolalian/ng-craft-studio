<app-ncs-card class="fixed top-4 left-74 right-4 h-22">
    <div class="flex justify-between items-center">
        <div class="flex gap-3">
            <svg lucideFolderClosed></svg>
            <p>My Workspace</p>
            <svg lucideChevronDown></svg>
        </div>

        <div class="flex gap-4 justify-center items-center">
            <div>
                <label class="hidden h-12 w-90 items-center gap-3 rounded-xl border border-slate-200 bg-[#fafbfe] px-4 text-sm transition 
                focus-within:border-blue-300 focus-within:ring-4 focus-within:ring-blue-100 lg:flex">
                    <svg lucideSearch class="h-5 w-5 shrink-0 text-blue-950/70"></svg>

                    <input type="search" placeholder="Search components..."
                        class="h-full min-w-0 flex-1 border-0 bg-transparent text-sm font-medium text-slate-700 outline-none placeholder:text-slate-400" />
                </label>
            </div>

            <div class="hidden h-8 w-px bg-slate-200 md:block"></div>
    
            <div class="flex items-center gap-3">
                <button ncsButton variant="ghost" size="icon-md" type="button" aria-label="Light mode">
                    <svg lucideSunMedium class="h-5 w-5 text-blue-950"></svg>
                </button>
    
                <button ncsButton variant="soft" size="icon-md" type="button" aria-label="Toggle dark mode"
                    (click)="toggleTheme()">
                    <svg lucideMoon class="h-5 w-5 text-blue-950"></svg>
                </button>
            </div>

            <div class="hidden h-8 w-px bg-slate-200 md:block"></div>

            <button ncsButton variant="secondary" align="start">
                <svg lucideBookmark></svg>
                Save Preset
            </button>
            
            <button ncsButton variant="primary" align="start">
                <svg lucideCodeXml></svg>
                Export Code
            </button>
        </div>
    </div>
</app-ncs-card>
